name: Validate hunts

on:
  pull_request:
    paths:
      - "hunts/**"
      - "scripts/validate_hunts.py"
      - ".github/workflows/validate-hunts.yml"
  push:
    branches: [main]
    paths:
      - "hunts/**"
      - "scripts/validate_hunts.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Validate hunt frontmatter and pivots
        run: python3 scripts/validate_hunts.py hunts
